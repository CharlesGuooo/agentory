<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Agentory</title>
  </head>
  <body>
    <!-- 自绘标题栏。整条是拖拽区，具体控件用 no-drag 挖回来。 -->
    <header class="titlebar" id="titlebar">
      <div class="brand">
        <!--
          标题栏标记 = 打包图标那个卡带的**单色版**。
          卡带靠材质对比（近黑壳 / 发光屏 / 金触点）才读得出「是个东西」，压成单色
          会糊成一个色块，所以用 currentColor 的两档不透明度保住「壳 + 屏」的层次。
          颜色跟主题走（填 --c-accent）—— 渐变在 15px 上本来就退化成一个中间色，
          而固定的青紫放进 PHOSPHOR 会像贴上去的。
        -->
        <svg class="mark" viewBox="0 0 64 64" width="15" height="15" aria-hidden="true">
          <path fill="currentColor" opacity=".45"
                d="M9,10 h46 a5,5 0 0 1 5,5 v30 a5,5 0 0 1 -5,5 h-9 v-5 h-28 v5 h-9
                   a5,5 0 0 1 -5,-5 v-30 a5,5 0 0 1 5,-5 z"/>
          <rect fill="currentColor" x="12" y="16" width="40" height="21" rx="3"/>
          <g fill="currentColor" opacity=".6">
            <rect x="19" y="43" width="7.4" height="9" rx="1.6"/>
            <rect x="28.3" y="43" width="7.4" height="9" rx="1.6"/>
            <rect x="37.6" y="43" width="7.4" height="9" rx="1.6"/>
          </g>
        </svg>Agentory
      </div>
      <div class="tabs" id="tabs"></div>
    </header>

    <div class="body">
      <aside class="side">
        <div class="side-top">
          <button class="btn-new" id="btnNew" type="button"><span>+</span><i data-i18n="side.newSession"></i></button>
          <button class="btn-search" id="btnHistory" type="button">
            <span>⌕</span><i data-i18n="side.history"></i><span class="count" id="historyCount"></span>
          </button>
        </div>
        <!--
          上次留下的会话。**刻意不是弹窗** —— 弹窗每次开应用都拦住你，
          而它和侧栏重复：未启动的成员本来就在下面列着，点一行就起。
          这条横幅只提供「一次全起」这一个额外能力，并且不挡路。
        -->
        <div class="resume-bar" id="resumeBar" hidden>
          <span class="txt" id="resumeText"></span>
          <button class="btn-ghost sm" id="resumeGo" type="button" data-i18n="side.resumeAll"></button>
          <button class="x" id="resumeSkip" type="button" data-i18n-aria="side.resumeSkip">✕</button>
          <span class="note" id="resumeNote"></span>
        </div>
        <!--
          侧栏里唯一的报错位。在它之前，「点一个未启动的成员 → 启动失败」
          在界面上的表现是**点一下什么都没发生** —— 主进程如实带回了
          `{ok:false, error}`，调用方直接丢掉了。目录被删、agent 卸了、
          路径在断开的网络盘上，都会走到这里。
        -->
        <div class="side-note" id="sideNote" hidden></div>
        <div class="tree" id="tree"></div>
        <!-- 收藏：与工作集正交，收藏不等于在跑。空的时候整块隐藏。 -->
        <div class="fav-wrap" id="favWrap" hidden>
          <div class="grp fav-head">
            <span class="car">★</span><i data-i18n="side.favorites"></i><span class="count" id="favCount">0</span>
          </div>
          <div class="fav-tree" id="favTree"></div>
        </div>
        <div class="side-foot">
          <span id="runningCount">—</span>
          <button class="gear" id="btnHarness" type="button" data-i18n-aria="hx.title" data-i18n-title="hx.title">⧉</button>
          <button class="gear" id="gear" type="button" data-i18n-aria="set.title" data-i18n-title="set.title">⚙</button>
        </div>
      </aside>
      <main class="term-host" id="terminal">
        <!-- 一个会话都没起来时的空态。不是装饰 —— 没有它这里就是一整片黑。 -->
        <!--
          两套文案。原来只有下面那套，它断言了「五个 agent 的会话都在里面」——
          在一台什么都没装的新机器上，那句话是假的，而它是主区最大字号、常驻可见的引导。
        -->
        <div class="term-empty" id="termEmpty">
          <div id="teReady">
            <p class="te-title" data-i18n="empty.noSession"></p>
            <p class="te-line" data-i18n-html="empty.newHint"></p>
            <p class="te-line" data-i18n-html="empty.histHint"></p>
          </div>
          <div id="teNoAgent" hidden>
            <p class="te-title" data-i18n="empty.noAgent"></p>
            <p class="te-line" data-i18n-html="empty.noAgentWhat"></p>
            <p class="te-line" data-i18n-html="empty.noAgentHow"></p>
          </div>
        </div>
      </main>
    </div>

    <!-- 设置：弹窗。默认隐藏。 -->
    <div class="scrim" id="scrim" hidden>
      <div class="panel" role="dialog" aria-modal="true" data-i18n-aria="set.title">
        <div class="panel-head">
          <h2 data-i18n="set.heading"></h2>
          <button class="close" id="settingsClose" type="button" data-i18n-aria="set.close">✕</button>
        </div>
        <div class="panel-body">
          <section class="field">
            <label id="modeLabel" data-i18n="set.mode"></label>
            <p class="desc" data-i18n="set.modeDesc"></p>
            <div class="seg" id="modeSeg" role="group" aria-labelledby="modeLabel">
              <button type="button" data-mode="system" data-i18n="set.modeSystem"></button>
              <button type="button" data-mode="light" data-i18n="set.modeLight"></button>
              <button type="button" data-mode="dark" data-i18n="set.modeDark"></button>
            </div>
          </section>
          <section class="field">
            <label id="sumLabel" data-i18n="sum.label"></label>
            <!--
              这一段原本只讲隐私（发什么、不发什么、上限多少），**从头到尾没提过要一把
              DeepSeek 的 key，更没说去哪拿** —— 于是用户打开开关，看到一个输入框，
              不知道该往里填什么、也不知道去哪弄。
            -->
            <p class="desc" data-i18n-html="sum.what"></p>
            <p class="desc" data-i18n-html="sum.privacy"></p>
            <div class="row">
              <button class="btn-ghost" id="sumToggle" type="button" aria-pressed="false"></button>
              <span class="desc" id="sumStatus"></span>
            </div>
            <div class="row" id="sumKeyRow" hidden>
              <input id="sumKey" class="search" type="password" placeholder="DeepSeek API key"
                     autocomplete="off" spellcheck="false" />
              <button class="btn-ghost" id="sumKeySave" type="button" data-i18n="sum.save"></button>
            </div>
            <div class="row" id="sumActions" hidden>
              <button class="btn-ghost" id="sumPeek" type="button" data-i18n="sum.peek"></button>
              <button class="btn-ghost" id="sumRunMine" type="button" data-i18n="sum.runMine"></button>
              <button class="btn-ghost" id="sumRunAll" type="button" data-i18n="sum.runAll"></button>
              <button class="btn-ghost" id="sumStop" type="button" hidden data-i18n="sum.stop"></button>
            </div>
            <p class="desc" id="sumProgress"></p>
            <pre class="peek" id="sumPeekBox" hidden></pre>
          </section>
          <section class="field">
            <label id="fontLabel" data-i18n="font.label"></label>
            <p class="desc" data-i18n-html="font.hint"></p>
            <div class="row">
              <span class="desc fixed-label" data-i18n="font.ui"></span>
              <div class="seg" id="uiFontSeg" role="group" aria-labelledby="fontLabel">
                <button type="button" data-uiscale="0.9" data-i18n="font.uiS"></button>
                <button type="button" data-uiscale="1" data-i18n="font.uiM"></button>
                <button type="button" data-uiscale="1.15" data-i18n="font.uiL"></button>
                <button type="button" data-uiscale="1.3" data-i18n="font.uiXL"></button>
              </div>
            </div>
            <div class="row">
              <span class="desc fixed-label" data-i18n="font.termSize"></span>
              <button class="btn-ghost sm" id="termFontDown" type="button" data-i18n-aria="font.smaller">−</button>
              <span class="desc num" id="termFontNow">13</span>
              <button class="btn-ghost sm" id="termFontUp" type="button" data-i18n-aria="font.bigger">+</button>
            </div>
            <div class="row">
              <span class="desc fixed-label" data-i18n="font.termFamily"></span>
              <select class="search" id="termFontFamily"></select>
            </div>
            <!--
              为什么只给终端选字体、界面不给：界面用的是系统字体栈，换掉基本只能把布局
              弄歪；而终端是你整天盯着读 agent 输出的地方。

              下拉里**只列本机真装了的**（canvas 量宽度当场探测）—— 写死一串名字的话，
              用户选了个没装的会静默退回下一个，界面上看起来像「选了但没生效」。
            -->
            <p class="desc" id="termFontNote"></p>
          </section>
          <section class="field">
            <label>Agent</label>
            <p class="desc" data-i18n-html="ver.what"></p>
            <div class="row">
              <button class="btn-ghost" id="verToggle" type="button" aria-pressed="true"></button>
              <span class="desc" id="verStatus"></span>
              <button class="btn-ghost" id="verCheck" type="button" data-i18n="ver.checkNow"></button>
            </div>
            <div class="agents" id="verRows"></div>
          </section>
          <section class="field">
            <label data-i18n="diag.label"></label>
            <p class="desc" data-i18n-html="diag.what"></p>
            <div class="row">
              <button class="btn-ghost" id="diagRun" type="button" data-i18n="diag.run"></button>
              <button class="btn-ghost" id="diagCopy" type="button" hidden data-i18n="diag.copy"></button>
              <span class="desc" id="diagStatus"></span>
            </div>
            <pre class="peek" id="diagBox" hidden></pre>
          </section>
          <section class="field">
            <label data-i18n="set.theme"></label>
            <p class="desc" id="themeDesc"></p>
            <div class="cards" id="cards"></div>
            <p class="warn" id="themeWarn" hidden></p>
          </section>
        </div>
      </div>
    </div>

    <!-- 新建会话：选 agent + 选目录。默认隐藏。 -->
    <div class="scrim" id="newScrim" hidden>
      <div class="panel" role="dialog" aria-modal="true" data-i18n-aria="new.title">
        <div class="panel-head">
          <h2 data-i18n="new.title"></h2>
          <button class="close" id="newClose" type="button" data-i18n-aria="set.close">✕</button>
        </div>
        <div class="panel-body">
          <section class="field">
            <label id="newAgentLabel" data-i18n="new.pickAgent"></label>
            <p class="desc" data-i18n="new.pickAgentDesc"></p>
            <div class="chips" id="newAgents" role="group" aria-labelledby="newAgentLabel"></div>
          </section>
          <section class="field">
            <label for="newCwd" data-i18n="new.cwd"></label>
            <p class="desc" data-i18n="new.cwdDesc"></p>
            <div class="row">
              <input
                id="newCwd"
                class="search"
                type="text"
                list="newCwdList"
                data-i18n-ph="new.cwdPlaceholder"
                autocomplete="off"
                spellcheck="false"
              />
              <datalist id="newCwdList"></datalist>
              <button class="btn-ghost" id="newBrowse" type="button" data-i18n="new.browse"></button>
            </div>
          </section>
          <p class="warn" id="newError" hidden></p>
          <!--
            一个 agent 都没检测到时的出路。**只说原因 + 指向官网，不写死安装命令** ——
            claude 刚从 npm 改成推荐原生安装器，写死的命令会烂掉，
            而烂掉的安装命令比没有更糟（D-15 立过这条规矩）。
          -->
          <div class="no-agent" id="newNoAgent" hidden>
            <p data-i18n-html="new.noAgent"></p>
            <div class="chips">
              <button class="btn-ghost btn-mini" type="button" data-url="https://code.claude.com/docs/en/quickstart">Claude Code</button>
              <button class="btn-ghost btn-mini" type="button" data-url="https://learn.chatgpt.com/docs/codex/cli">Codex</button>
              <button class="btn-ghost btn-mini" type="button" data-url="https://opencode.ai">OpenCode</button>
              <button class="btn-ghost btn-mini" type="button" data-url="https://github.com/earendil-works/pi">Pi</button>
              <button class="btn-ghost btn-mini" type="button" data-url="https://x.ai/cli">Grok</button>
            </div>
            <p class="desc" data-i18n-html="new.afterInstall"></p>
          </div>
        </div>
        <div class="panel-foot">
          <button class="btn-primary" id="newGo" type="button" disabled data-i18n="new.go"></button>
        </div>
      </div>
    </div>

    <!-- 快捷键表。F1 打开。内容由 shortcuts.ts 那张表渲染 —— 表是唯一真源。 -->
    <div class="scrim" id="keysScrim" hidden>
      <div class="panel" role="dialog" aria-modal="true" data-i18n-aria="keys.title">
        <div class="panel-head">
          <h2 data-i18n="keys.title"></h2>
          <button class="close" id="keysClose" type="button" data-i18n-aria="set.close">✕</button>
        </div>
        <div class="panel-body">
          <p class="desc" data-i18n-html="keys.why"></p>
          <div class="keys" id="keysList"></div>
        </div>
      </div>
    </div>

    <!-- 历史会话：独立视图，不进侧栏（D-5 / D-8）。默认隐藏。 -->
    <div class="scrim" id="histScrim" hidden>
      <div class="panel panel-wide" role="dialog" aria-modal="true" data-i18n-aria="hist.title">
        <div class="panel-head">
          <h2 data-i18n="hist.title"></h2>
          <span class="subtle" id="histSummary"></span>
          <button class="close" id="histClose" type="button" data-i18n-aria="set.close">✕</button>
        </div>
        <div class="hist-tools">
          <input
            id="histSearch"
            class="search"
            type="search"
            data-i18n-ph="hist.searchPlaceholder"
            autocomplete="off"
          />
          <div class="chips" id="histAgents"></div>
        </div>
        <!--
          扫描时读不动的来源。主进程一直如实带回 `problems`，而调用方只取了
          `sessions` —— 于是「opencode 的库被锁住」在界面上的表现就是计数
          从 437 变成 271，零解释。少掉的会话必须有个说法。
        -->
        <div class="hist-problems" id="histProblems" hidden></div>
        <div class="hist-list" id="histList"></div>
      </div>
    </div>

    <!--
      Skills 与 MCP。独立弹窗而不是设置里的第五块：矩阵是张宽表，
      塞进 720px 单列纵向流会把「主题」推出首屏。
    -->
    <div class="scrim" id="hxScrim" hidden>
      <div class="panel panel-wide" role="dialog" aria-modal="true" data-i18n-aria="hx.title">
        <div class="panel-head">
          <h2 data-i18n="hx.title"></h2>
          <span class="subtle" id="hxSummary"></span>
          <button class="close" id="hxClose" type="button" data-i18n-aria="set.close">✕</button>
        </div>
        <div class="hist-tools">
          <label class="hx-scope">
            <i data-i18n="hx.scope"></i>
            <select id="hxScope" class="search"></select>
          </label>
          <input id="hxSearch" class="search" type="search" data-i18n-ph="hx.searchPlaceholder"
                 autocomplete="off" />
        </div>
        <!-- 状态条先于格子 —— 没有它，空格子会被读成「没配」而不是「读不到」 -->
        <div class="hx-sources" id="hxSources"></div>
        <div class="hx-body" id="hxBody"></div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
