<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    16 / 20 px 专用的简化版。

    **不是把大图缩小** —— 大图在这个尺寸上会糊成一团：三行文字挤成一坨、
    四个触点连成一条、辉光把边缘吃掉。同一个标记按尺寸换画法是正经做法。

    简化了四处：三行文字 → 两行且加粗、四个触点 → 三个且加宽、
    去掉辉光与内嵌阴影（那个尺寸上它们只贡献模糊）、屏幕留白加大。
    保留的是唯一不能丢的：外壳的亮边，以及金色触点这第二种材质。
  -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2=".32" y2="1">
      <stop offset="0" stop-color="#2C333F"/>
      <stop offset=".42" stop-color="#171C24"/>
      <stop offset="1" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8CEFFC"/>
      <stop offset="1" stop-color="#8B4BF0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7DE97"/>
      <stop offset="1" stop-color="#9A7830"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".62"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <path id="body" d="M9,10 h46 a5,5 0 0 1 5,5 v30 a5,5 0 0 1 -5,5 h-9 v-5 h-28 v5 h-9
                       a5,5 0 0 1 -5,-5 v-30 a5,5 0 0 1 5,-5 z"/>
    <clipPath id="inside"><use href="#body"/></clipPath>
  </defs>

  <g fill="url(#gold)">
    <rect x="19" y="43" width="7.4" height="10" rx="1.6"/>
    <rect x="28.3" y="43" width="7.4" height="10" rx="1.6"/>
    <rect x="37.6" y="43" width="7.4" height="10" rx="1.6"/>
  </g>

  <use href="#body" fill="url(#shell)"/>

  <g clip-path="url(#inside)">
    <rect x="9" y="15" width="46" height="23" rx="3" fill="url(#screen)"/>
    <g fill="#0A0C10" opacity=".5">
      <rect x="14" y="20" width="26" height="4.6" rx="2.3"/>
      <rect x="14" y="28.4" width="17" height="4.6" rx="2.3"/>
      <rect x="43.5" y="28.4" width="6" height="4.6" rx="2"/>
    </g>
  </g>

  <use href="#body" fill="none" stroke="url(#rim)" stroke-width="1.4"/>
</svg>
